<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Naice Notes — Direction 1.5: Minimal+ (adapted)</title>
<style>
  :root {
    --bg: #FAFAFA;
    --fg: #111;
    --fg-muted: #8A8A8A;
    --hairline: rgba(0,0,0,0.08);
    --ring: rgba(0,0,0,0.16);
    --shopping: #4CAF50;
    --work: #2196F3;
    --reading: #9C27B0;
    --accent: var(--shopping);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F0F10; --fg: #FAFAFA; --fg-muted: #888; --hairline: rgba(255,255,255,0.10); --ring: rgba(255,255,255,0.18); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    background: #2A2A2C; color: var(--fg);
    display: flex; justify-content: center;
  }
  .phone {
    width: 412px; height: 870px;
    background: var(--bg);
    border-radius: 44px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    position: relative;
  }
  .statusbar { height: 44px; }

  header {
    padding: 8px 24px 0;
  }
  h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }

  .toolbar {
    display: flex; justify-content: flex-end; align-items: center;
    padding: 8px 16px;
  }
  .icon-btn {
    width: 40px; height: 40px; display: grid; place-items: center;
    color: var(--fg); cursor: pointer;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    .icon-btn { background: rgba(255,255,255,0.08); }
  }
  .icon-btn:hover { background: rgba(0,0,0,0.10); }
  .icon-btn svg { width: 20px; height: 20px; }

  .tabs {
    display: flex; gap: 8px; padding: 18px 16px 12px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 999px;
    font-size: 14px; font-weight: 600; white-space: nowrap;
    border: 1.5px solid var(--ring); color: var(--fg);
    background: transparent;
    cursor: pointer;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .pill.active {
    background: var(--accent); border-color: var(--accent); color: white;
  }
  .pill.active .dot { background: white; }
  .pill.new {
    border-style: dashed; color: var(--fg-muted);
  }
  .pill.new::before { content: "+"; font-weight: 700; margin-right: 2px; }

  .meta { padding: 0 24px 8px; color: var(--fg-muted); font-size: 13px; }

  .items { flex: 1; overflow-y: auto; padding: 4px 0 8px; }
  .item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 24px;
  }
  .check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--ring);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .item.done .check { background: var(--accent); border-color: var(--accent); }
  .item.done .check::after {
    content: ""; width: 10px; height: 5px;
    border-left: 2px solid white; border-bottom: 2px solid white;
    transform: rotate(-45deg) translate(1px, -1px);
  }
  .text { font-size: 17px; line-height: 1.3; flex: 1; }
  .item.done .text { color: var(--fg-muted); text-decoration: line-through; }

  .divider {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 24px 0; color: var(--fg-muted);
    font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1;
    border-top: 1px dashed var(--hairline);
  }

  .composer {
    border-top: 1px solid var(--hairline);
    padding: 12px 16px; display: flex; align-items: center; gap: 8px;
  }
  .composer input {
    flex: 1; border: 0; background: transparent;
    font: inherit; font-size: 16px; color: var(--fg);
    padding: 12px 8px; outline: none;
  }
  .composer input::placeholder { color: var(--fg-muted); }
  .send {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent);
    display: grid; place-items: center; color: white; font-size: 16px;
  }

  .home-indicator { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--fg); opacity: 0.4; border-radius: 3px; }
  .caption { color: rgba(255,255,255,0.7); font-size: 13px; margin-top: 16px; text-align: center; font-family: monospace; max-width: 412px; }
</style>
</head>
<body>
<div>
<div class="phone">
  <div class="statusbar"></div>

  <header>
    <h1>Shopping</h1>
  </header>

  <div class="tabs">
    <div class="pill active"><span class="dot"></span>Shopping</div>
    <div class="pill"><span class="dot" style="background: var(--work)"></span>Work</div>
    <div class="pill"><span class="dot" style="background: var(--reading)"></span>Reading</div>
    <div class="pill new">new</div>
  </div>

  <div class="meta">4 open · 2 done</div>

  <div class="items">
    <div class="item"><div class="check"></div><div class="text">olive oil</div></div>
    <div class="item"><div class="check"></div><div class="text">3 ripe tomatoes</div></div>
    <div class="item"><div class="check"></div><div class="text">fresh basil leaves</div></div>
    <div class="item"><div class="check"></div><div class="text">mozzarella</div></div>

    <div class="divider">2 done</div>

    <div class="item done"><div class="check"></div><div class="text">2 cups flour</div></div>
    <div class="item done"><div class="check"></div><div class="text">1 tsp salt</div></div>
  </div>

  <div class="toolbar">
    <div class="icon-btn" title="Section actions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <circle cx="12" cy="5" r="0.5" fill="currentColor"/>
        <circle cx="12" cy="12" r="0.5" fill="currentColor"/>
        <circle cx="12" cy="19" r="0.5" fill="currentColor"/>
      </svg>
    </div>
  </div>
  <div class="composer">
    <input placeholder="Add to Shopping" />
    <div class="send">↑</div>
  </div>

  <div class="home-indicator"></div>
</div>
<div class="caption">Direction 1.5 · Minimal+ · pill tabs + open/done divider + per-section accent</div>
</div>
</body>
</html>

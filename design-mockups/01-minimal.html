<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Naice Notes — Direction 1: Minimal Mono</title>
<style>
  :root {
    --bg: #FAFAFA;
    --fg: #111;
    --fg-muted: #888;
    --hairline: rgba(0,0,0,0.08);
    --accent: #4CAF50; /* active section color */
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F0F10; --fg: #FAFAFA; --fg-muted: #888; --hairline: rgba(255,255,255,0.10); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    background: #2A2A2C; color: var(--fg);
    display: flex; justify-content: center;
  }
  .phone {
    width: 412px; height: 870px;
    background: var(--bg);
    border-radius: 44px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    position: relative;
  }
  .statusbar { height: 44px; }
  header { padding: 8px 24px 0; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .tabs {
    display: flex; gap: 24px; padding: 24px 24px 0;
    overflow-x: auto; scrollbar-width: none;
    border-bottom: 1px solid var(--hairline);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    font-size: 15px; font-weight: 500; color: var(--fg-muted);
    padding: 8px 0 14px; white-space: nowrap; cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active { color: var(--fg); border-color: var(--accent); font-weight: 600; }
  .tab.new { color: var(--fg-muted); }
  .items { flex: 1; overflow-y: auto; padding: 8px 0; }
  .item {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px;
  }
  .check {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--fg-muted);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .item.done .check { background: var(--accent); border-color: var(--accent); }
  .item.done .check::after {
    content: ""; width: 10px; height: 5px;
    border-left: 2px solid white; border-bottom: 2px solid white;
    transform: rotate(-45deg) translate(1px, -1px);
  }
  .text { font-size: 17px; line-height: 1.3; }
  .item.done .text { color: var(--fg-muted); text-decoration: line-through; }
  .composer {
    border-top: 1px solid var(--hairline);
    padding: 12px 16px; display: flex; align-items: center; gap: 8px;
  }
  .composer input {
    flex: 1; border: 0; background: transparent;
    font: inherit; font-size: 16px; color: var(--fg);
    padding: 12px 8px; outline: none;
  }
  .composer input::placeholder { color: var(--fg-muted); }
  .send { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: white; font-size: 16px; }
  .home-indicator { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--fg); opacity: 0.4; border-radius: 3px; }
  .caption { color: rgba(255,255,255,0.7); font-size: 13px; margin-top: 16px; text-align: center; font-family: monospace; }
</style>
</head>
<body>
<div>
<div class="phone">
  <div class="statusbar"></div>
  <header>
    <h1>Shopping</h1>
  </header>
  <div class="tabs">
    <div class="tab active">Shopping</div>
    <div class="tab">Work</div>
    <div class="tab">Reading</div>
    <div class="tab new">+</div>
  </div>
  <div class="items">
    <div class="item done"><div class="check"></div><div class="text">2 cups flour</div></div>
    <div class="item done"><div class="check"></div><div class="text">1 tsp salt</div></div>
    <div class="item"><div class="check"></div><div class="text">olive oil</div></div>
    <div class="item"><div class="check"></div><div class="text">3 ripe tomatoes</div></div>
    <div class="item"><div class="check"></div><div class="text">fresh basil leaves</div></div>
    <div class="item"><div class="check"></div><div class="text">mozzarella</div></div>
  </div>
  <div class="composer">
    <input placeholder="Add an item" />
    <div class="send">↑</div>
  </div>
  <div class="home-indicator"></div>
</div>
<div class="caption">Direction 1 · Minimal Mono · Bear / Things 3 / Linear vibe</div>
</div>
</body>
</html>

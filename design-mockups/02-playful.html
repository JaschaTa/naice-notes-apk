<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Naice Notes — Direction 2: Playful Color</title>
<style>
  :root {
    --shopping: #4CAF50;
    --shopping-soft: #E8F5E9;
    --work: #2196F3;
    --reading: #9C27B0;
    --bg: #FFF8F1;       /* warm cream */
    --tint: rgba(76,175,80,0.06); /* tint by active section */
    --fg: #1A1410;
    --fg-muted: #8A7E73;
    --card: #FFFFFF;
    --shadow: 0 1px 2px rgba(20,10,0,0.04), 0 6px 16px rgba(20,10,0,0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, "Nunito", system-ui, sans-serif;
    background: #2A2A2C; color: var(--fg);
    display: flex; justify-content: center;
  }
  .phone {
    width: 412px; height: 870px;
    background: linear-gradient(to bottom, var(--bg), var(--bg)) padding-box,
                var(--tint);
    background: var(--bg);
    border-radius: 44px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    position: relative;
  }
  .tint-overlay {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, var(--tint), transparent 240px);
  }
  .statusbar { height: 44px; }
  header { padding: 12px 24px 0; display: flex; align-items: baseline; gap: 12px; position: relative; }
  h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .count { color: var(--fg-muted); font-weight: 600; font-size: 17px; }
  .tabs {
    display: flex; gap: 8px; padding: 18px 24px 8px;
    overflow-x: auto; scrollbar-width: none;
    position: relative;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 999px;
    font-size: 14px; font-weight: 700; white-space: nowrap;
    background: white; color: var(--fg);
    border: 1.5px solid rgba(20,10,0,0.08);
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(20,10,0,0.02);
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; }
  .pill.active {
    background: var(--shopping); color: white;
    border-color: var(--shopping);
    box-shadow: 0 4px 12px rgba(76,175,80,0.35);
  }
  .pill.active .dot { background: white; }
  .pill.new { background: transparent; border-style: dashed; color: var(--fg-muted); font-weight: 700; }
  .items { flex: 1; overflow-y: auto; padding: 12px 16px 24px; position: relative; display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border-radius: 18px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .check {
    width: 26px; height: 26px; border-radius: 8px;
    border: 2px solid var(--shopping); background: white;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .item.done .check { background: var(--shopping); border-color: var(--shopping); }
  .item.done .check::after {
    content: ""; width: 12px; height: 6px;
    border-left: 2.5px solid white; border-bottom: 2.5px solid white;
    transform: rotate(-45deg) translate(1px, -1px);
  }
  .text { font-size: 17px; font-weight: 600; line-height: 1.25; }
  .item.done .text { color: var(--fg-muted); text-decoration: line-through; }
  .composer {
    padding: 12px 16px 18px; display: flex; align-items: center; gap: 10px;
    position: relative;
  }
  .composer input {
    flex: 1; border: 0; background: white;
    font: inherit; font-size: 16px; font-weight: 600; color: var(--fg);
    padding: 14px 18px; outline: none;
    border-radius: 999px;
    box-shadow: var(--shadow);
  }
  .composer input::placeholder { color: var(--fg-muted); }
  .send {
    width: 48px; height: 48px; border-radius: 50%; background: var(--shopping);
    display: grid; place-items: center; color: white; font-size: 20px;
    box-shadow: 0 4px 12px rgba(76,175,80,0.4);
  }
  .home-indicator { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--fg); opacity: 0.4; border-radius: 3px; }
  .caption { color: rgba(255,255,255,0.7); font-size: 13px; margin-top: 16px; text-align: center; font-family: monospace; }
</style>
</head>
<body>
<div>
<div class="phone">
  <div class="tint-overlay"></div>
  <div class="statusbar"></div>
  <header>
    <h1>Shopping</h1>
    <span class="count">4 left</span>
  </header>
  <div class="tabs">
    <div class="pill active"><span class="dot"></span>Shopping</div>
    <div class="pill"><span class="dot" style="background: var(--work)"></span>Work</div>
    <div class="pill"><span class="dot" style="background: var(--reading)"></span>Reading</div>
    <div class="pill new">+ new</div>
  </div>
  <div class="items">
    <div class="item done"><div class="check"></div><div class="text">2 cups flour</div></div>
    <div class="item done"><div class="check"></div><div class="text">1 tsp salt</div></div>
    <div class="item"><div class="check"></div><div class="text">olive oil</div></div>
    <div class="item"><div class="check"></div><div class="text">3 ripe tomatoes</div></div>
    <div class="item"><div class="check"></div><div class="text">fresh basil leaves</div></div>
    <div class="item"><div class="check"></div><div class="text">mozzarella</div></div>
  </div>
  <div class="composer">
    <input placeholder="Add to Shopping…" />
    <div class="send">↑</div>
  </div>
  <div class="home-indicator"></div>
</div>
<div class="caption">Direction 2 · Playful Color · Reminders / Notion meets character</div>
</div>
</body>
</html>

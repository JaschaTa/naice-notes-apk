<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Naice Notes — Direction 3: Dense / Notion-style</title>
<style>
  :root {
    --bg: #FBFBF9;
    --fg: #2F2F2D;
    --fg-muted: #9A9A95;
    --hairline: rgba(0,0,0,0.06);
    --shopping: #4CAF50;
    --work: #2196F3;
    --reading: #9C27B0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1B1B19; --fg: #E8E8E4; --fg-muted: #7C7C76; --hairline: rgba(255,255,255,0.08); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: #2A2A2C; color: var(--fg);
    display: flex; justify-content: center;
  }
  .phone {
    width: 412px; height: 870px;
    background: var(--bg);
    border-radius: 44px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    display: flex; flex-direction: column;
    position: relative;
    font-feature-settings: "cv11" 1, "ss01" 1;
  }
  .statusbar { height: 44px; }
  header {
    padding: 14px 20px 12px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--hairline);
  }
  .title-row { display: flex; align-items: center; gap: 10px; }
  .dot-lg { width: 10px; height: 10px; border-radius: 50%; background: var(--shopping); }
  h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .meta { font-size: 12px; color: var(--fg-muted); }
  .icon-btn { width: 28px; height: 28px; display: grid; place-items: center; color: var(--fg-muted); font-size: 18px; cursor: pointer; border-radius: 6px; }
  .icon-btn:hover { background: var(--hairline); }
  .tabs {
    display: flex; gap: 4px; padding: 8px 12px;
    overflow-x: auto; scrollbar-width: none;
    border-bottom: 1px solid var(--hairline);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 6px;
    font-size: 13px; font-weight: 500; color: var(--fg-muted);
    white-space: nowrap; cursor: pointer;
  }
  .chip:hover { background: var(--hairline); }
  .chip.active { background: rgba(76,175,80,0.12); color: var(--fg); font-weight: 600; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip.new { color: var(--fg-muted); font-weight: 500; }
  .items { flex: 1; overflow-y: auto; padding: 4px 0 8px; }
  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 20px;
    font-size: 14px;
    line-height: 1.4;
  }
  .item:hover { background: var(--hairline); }
  .check {
    width: 16px; height: 16px; border-radius: 4px;
    border: 1.5px solid var(--fg-muted); background: transparent;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .item.done .check { background: var(--shopping); border-color: var(--shopping); }
  .item.done .check::after {
    content: ""; width: 8px; height: 4px;
    border-left: 1.5px solid white; border-bottom: 1.5px solid white;
    transform: rotate(-45deg) translate(1px, -1px);
  }
  .item.done .text { color: var(--fg-muted); text-decoration: line-through; }
  .composer {
    border-top: 1px solid var(--hairline);
    padding: 8px 16px; display: flex; align-items: center; gap: 8px;
  }
  .composer input {
    flex: 1; border: 0; background: transparent;
    font: inherit; font-size: 14px; color: var(--fg);
    padding: 8px 0; outline: none;
  }
  .composer input::placeholder { color: var(--fg-muted); }
  .send { font-size: 13px; font-weight: 600; color: var(--shopping); padding: 4px 8px; cursor: pointer; }
  .home-indicator { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--fg); opacity: 0.4; border-radius: 3px; }
  .caption { color: rgba(255,255,255,0.7); font-size: 13px; margin-top: 16px; text-align: center; font-family: monospace; }
</style>
</head>
<body>
<div>
<div class="phone">
  <div class="statusbar"></div>
  <header>
    <div class="title-row">
      <div class="dot-lg"></div>
      <h1>Shopping</h1>
      <span class="meta">· 4 open · 2 done</span>
    </div>
    <div class="icon-btn">⋯</div>
  </header>
  <div class="tabs">
    <div class="chip active"><span class="dot" style="background: var(--shopping)"></span>Shopping</div>
    <div class="chip"><span class="dot" style="background: var(--work)"></span>Work</div>
    <div class="chip"><span class="dot" style="background: var(--reading)"></span>Reading</div>
    <div class="chip new">+ section</div>
  </div>
  <div class="items">
    <div class="item done"><div class="check"></div><div class="text">2 cups flour</div></div>
    <div class="item done"><div class="check"></div><div class="text">1 tsp salt</div></div>
    <div class="item"><div class="check"></div><div class="text">olive oil</div></div>
    <div class="item"><div class="check"></div><div class="text">3 ripe tomatoes</div></div>
    <div class="item"><div class="check"></div><div class="text">fresh basil leaves</div></div>
    <div class="item"><div class="check"></div><div class="text">mozzarella</div></div>
    <div class="item"><div class="check"></div><div class="text">pine nuts</div></div>
    <div class="item"><div class="check"></div><div class="text">balsamic vinegar</div></div>
    <div class="item"><div class="check"></div><div class="text">red wine</div></div>
  </div>
  <div class="composer">
    <input placeholder="Add an item…" />
    <div class="send">Add</div>
  </div>
  <div class="home-indicator"></div>
</div>
<div class="caption">Direction 3 · Dense / Notion-style · power-user, info-rich</div>
</div>
</body>
</html>
